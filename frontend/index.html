<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulatory Compliance Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">⚖️ Compliance RAG Assistant</h1>
        <span class="text-xs bg-emerald-600 text-white px-2 py-1 rounded">API Connected</span>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-lg max-w-xl text-sm">
                Hello! Ask me any question regarding your compliance documents or emergency amendments.
            </div>
        </div>
    </main>

    <!-- Input Box -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Ask a compliance question..." 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-emerald-500"
                autocomplete="off"
                required
            >
            <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-lg font-medium text-sm transition">
                Send
            </button>
        </form>
    </footer>

    <script>
        const API_URL = "http://localhost:8000/chat"; // Replace with deployed backend URL later
        const chatContainer = document.getElementById("chat-container");
        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const question = userInput.value.trim();
            if (!question) return;

            // Append User Message
            appendMessage(question, "user");
            userInput.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading state
            const loadingId = appendMessage("Analyzing regulations...", "assistant", true);

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });
                
                const data = await res.json();
                
                // Format metrics & response
                let metricsHtml = "<div class='text-xs text-slate-400 mb-2'><strong>Retrieval Metrics (Cosine Distance):</strong><ul>";
                data.metrics.forEach(m => {
                    metricsHtml += `<li>Match ${m.rank}: Distance <code>${m.distance}</code> | File: <code>${m.source}</code> (Page ${m.page})</li>`;
                });
                metricsHtml += "</ul></div><hr class='border-slate-700 my-2'>";

                const finalHtml = metricsHtml + `<div class='whitespace-pre-wrap'>${data.response}</div>`;
                
                updateMessage(loadingId, finalHtml);
            } catch (err) {
                updateMessage(loadingId, "Error connecting to the backend API.");
            }
        });

        function appendMessage(text, sender, isLoading = false) {
            const id = 'msg-' + Date.now();
            const isUser = sender === "user";
            const alignment = isUser ? "justify-end" : "justify-start";
            const bg = isUser ? "bg-emerald-700 text-white" : "bg-slate-800 border border-slate-700 text-slate-100";
            
            const html = `
                <div class="flex ${alignment}" id="${id}">
                    <div class="${bg} p-4 rounded-lg max-w-2xl text-sm shadow">
                        ${text}
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function updateMessage(id, htmlContent) {
            const el = document.getElementById(id);
            if (el) {
                el.querySelector("div").innerHTML = htmlContent;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
